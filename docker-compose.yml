services:
  backend:
    build:
      context: .
      args:
        TORCH_INDEX: ${TORCH_INDEX:-https://download.pytorch.org/whl/cpu}
    env_file: .env
    environment:
      DATABASE_URL: sqlite:////data/paper_trail.db
    ports:
      - "8000:8000"
    volumes:
      - db:/data
      - evidence_cache:/app/cache
      - hf_cache:/home/app/.cache/huggingface
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  db:
  evidence_cache:
  hf_cache:
