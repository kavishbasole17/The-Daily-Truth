[tool.ruff]
target-version = "py311"
line-length = 120
extend-exclude = ["notebooks", "frontend", "cache", "results"]

[tool.ruff.lint]
# Ruff's default rule set, minus two rules that contradict deliberate patterns here:
ignore = [
    # FastAPI's dependency injection *is* a call in a default argument:
    # `db: Session = Depends(get_db)`, `file: UploadFile = File(...)`.
    "B008",
    # The verification pipeline catches every failure on purpose: each stage
    # turns an exception into a recorded degradation (and an `uncertain`
    # verdict) instead of crashing the request or guessing.
    "BLE001",
]

[tool.ruff.lint.per-file-ignores]
# Tests assert on private helpers and use bare asserts by design.
"tests/**" = ["S101", "PLR2004"]
